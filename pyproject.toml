    "nflreadpy>=0.1.5",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pulp<3",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]
